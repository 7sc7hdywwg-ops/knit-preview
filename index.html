<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f0ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Knit Preview">
<link rel="manifest" href="./manifest.webmanifest">
<title>Knit Preview Studio</title>
<style>
:root{--bg:#f4f0ea;--panel:#fffdf9;--ink:#26221f;--muted:#786f68;--line:#d9d2ca;--btn:#2c2926;--soft:#e8e2db}
*{box-sizing:border-box} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:rgba(244,240,234,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-weight:750}.small{font-size:11px;color:var(--muted);line-height:1.45}
.header-actions{display:flex;gap:8px;flex-wrap:wrap} button,input{font:inherit}
button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 11px;color:var(--ink)} button.primary{background:var(--btn);color:#fff;border-color:var(--btn)} button:disabled{opacity:.4}
.app{display:grid;grid-template-columns:290px minmax(340px,1fr) minmax(340px,1.1fr);gap:12px;padding:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 12px rgba(32,25,20,.035);overflow:hidden}
.panel h2{font-size:15px;margin:0;padding:13px 14px;border-bottom:1px solid var(--line)} .body{padding:13px 14px}
.section{margin-bottom:17px}.section:last-child{margin-bottom:0}.section-title{font-size:12px;color:var(--muted);font-weight:650;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.toolbar,.palette,.segment{display:flex;gap:7px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;padding:0;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)} .swatch.active{border-color:#1e1b19;outline:2px solid #fff;outline-offset:-4px}
.color-row{display:grid;grid-template-columns:44px 1fr 38px;gap:7px;align-items:center;margin-bottom:7px}.color-row input[type=color]{width:44px;height:38px;border:0;padding:0;background:transparent}.color-row input[type=text]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px}
.preview-wrap{min-height:420px;overflow:auto;background:var(--soft);padding:14px;display:flex;align-items:flex-start;justify-content:center} #preview{display:block;background:var(--soft);border-radius:12px;max-width:none}
.chart-wrap{overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;padding:14px;background:#faf8f5;min-height:420px;cursor:grab}
.chart-wrap.grabbing{cursor:grabbing}
#chart{display:grid;gap:1px;width:max-content;background:#cfc7bf;padding:1px;border-radius:7px;user-select:none}
.cell{width:27px;height:27px;border:0;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:9px;color:rgba(0,0,0,.45);touch-action:none}
.cell.selected{outline:2px solid #111;outline-offset:-2px}
.status{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.segment button.active{background:var(--btn);color:#fff;border-color:var(--btn)}
.tip{margin:10px 14px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:12px;background:#fcfaf7}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2c2926;color:#fff;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:50}.toast.show{opacity:1}
@media(max-width:1050px){.app{grid-template-columns:1fr 1fr}.settings{grid-column:1/-1}}
@media(max-width:740px){header{align-items:flex-start}.app{grid-template-columns:1fr;padding:8px}.settings{order:3}.preview-panel{order:1}.chart-panel{order:2}.preview-wrap,.chart-wrap{min-height:320px}.cell{width:25px;height:25px}}
</style>
</head>
<body>
<header>
  <div><div class="brand">Knit Preview Studio</div><div class="small">編み込み模様を描いて、編み地をリアルタイム確認</div></div>
  <div class="header-actions"><button id="undo">↶ 戻す</button><button id="redo">↷ やり直す</button><button id="save" class="primary">保存</button></div>
</header>
<div class="tip">編み図の横スクロールは「移動」モードでできます。リピートはそのまま使えます。</div>
<main class="app">
<section class="panel settings"><h2>設定</h2><div class="body">
<div class="section"><p class="section-title">編み図サイズ</p><div class="grid2"><div class="field"><label>横の目数</label><input id="cols" type="number" min="1" max="100" value="16"></div><div class="field"><label>縦の段数</label><input id="rows" type="number" min="1" max="100" value="18"></div></div><div class="toolbar" style="margin-top:8px"><button id="resize" class="primary">サイズ変更</button><button id="clear">全消去</button></div></div>
<div class="section"><p class="section-title">リピート</p><div class="grid2"><div class="field"><label>横</label><input id="repX" type="number" min="1" max="12" value="3"></div><div class="field"><label>縦</label><input id="repY" type="number" min="1" max="12" value="2"></div></div></div>
<div class="section"><p class="section-title">ゲージ（10cm）</p><div class="grid2"><div class="field"><label>目</label><input id="gaugeSt" type="number" min="1" value="22"></div><div class="field"><label>段</label><input id="gaugeRow" type="number" min="1" value="30"></div></div></div>
<div class="section"><p class="section-title">糸の色</p><div id="colorEditor"></div><div class="toolbar"><button id="addColor">＋ 色を追加</button></div><div class="palette" id="palette" style="margin-top:10px"></div></div>
<div class="section"><p class="section-title">編集</p><div class="segment"><button id="paintMode" class="active">塗る</button><button id="selectMode">選択</button><button id="moveMode">移動</button></div><div class="toolbar" style="margin-top:8px"><button id="mirrorH">左右反転</button><button id="mirrorV">上下反転</button><button id="shiftL">← 1目</button><button id="shiftR">1目 →</button></div><p class="small">「移動」では横スライドしやすくなります。塗る時は「塗る」に戻してください。</p><div class="toolbar"><button id="copySel" disabled>選択をコピー</button><button id="pasteSel" disabled>貼り付け</button><button id="clearSel" disabled>選択解除</button></div></div>
<div class="section"><p class="section-title">データ</p><div class="toolbar"><button id="load">保存を開く</button><button id="exportPng">プレビューPNG</button><button id="exportJson">編み図JSON</button><label style="display:inline-block"><input id="importJson" type="file" accept=".json,application/json" style="display:none"><button type="button" id="importBtn">JSON読込</button></label></div></div>
<div class="small">※ データ保存はこのブラウザ内です。オフライン時でも最後に保存したデータを開けます。</div>
</div></section>
<section class="panel chart-panel"><h2>編み図</h2><div class="chart-wrap" id="chartWrap"><div id="chart"></div></div><div class="status"><span id="chartInfo"></span><span id="modeInfo">塗るモード</span></div></section>
<section class="panel preview-panel"><h2>編み地プレビュー</h2><div class="preview-wrap"><canvas id="preview"></canvas></div><div class="status"><span id="sizeInfo"></span><span id="repeatInfo"></span></div></section>
</main>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove("show"),2200)}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}

let rows=18, cols=16;
let colors=[{name:"アイボリー",value:"#E9E0CF"},{name:"チャコール",value:"#414348"},{name:"くすみブルー",value:"#8FA7B4"}];
let activeColor=1, grid=[], undoStack=[], redoStack=[], mode="paint", isDown=false, paintValue=null, selStart=null, selEnd=null, clipboard=null;
const chartWrap=$("chartWrap");
function emptyGrid(r,c){return Array.from({length:r},()=>Array(c).fill(0))}
function snapshot(){undoStack.push(JSON.stringify({grid,colors,rows,cols}));if(undoStack.length>50)undoStack.shift();redoStack=[];updateUndo()}
function restoreState(s){const d=JSON.parse(s);grid=d.grid;colors=d.colors;rows=d.rows;cols=d.cols;$("rows").value=rows;$("cols").value=cols;renderColors();renderChart();renderPreview()}
function updateUndo(){$("undo").disabled=!undoStack.length;$("redo").disabled=!redoStack.length}
$("undo").onclick=()=>{if(!undoStack.length)return;redoStack.push(JSON.stringify({grid,colors,rows,cols}));restoreState(undoStack.pop());updateUndo()}
$("redo").onclick=()=>{if(!redoStack.length)return;undoStack.push(JSON.stringify({grid,colors,rows,cols}));restoreState(redoStack.pop());updateUndo()}
function init(){grid=emptyGrid(rows,cols);renderColors();renderChart();renderPreview();updateUndo()}
function renderColors(){const ed=$("colorEditor");ed.innerHTML="";colors.forEach((c,i)=>{const row=document.createElement("div");row.className="color-row";const col=document.createElement("input");col.type="color";col.value=c.value;const name=document.createElement("input");name.type="text";name.value=c.name;const del=document.createElement("button");del.textContent="×";del.disabled=colors.length<=2;col.oninput=()=>{snapshot();colors[i].value=col.value;renderPalette();renderChart();renderPreview()};name.oninput=()=>{colors[i].name=name.value;renderPalette()};del.onclick=()=>{snapshot();colors.splice(i,1);grid=grid.map(r=>r.map(v=>v===i?0:(v>i?v-1:v)));activeColor=Math.min(activeColor,colors.length-1);renderColors();renderChart();renderPreview()};row.append(col,name,del);ed.appendChild(row)});renderPalette()}
function renderPalette(){const p=$("palette");p.innerHTML="";colors.forEach((c,i)=>{const b=document.createElement("button");b.className="swatch"+(i===activeColor?" active":"");b.style.background=c.value;b.title=c.name;b.onclick=()=>{activeColor=i;renderPalette()};p.appendChild(b)})}
$("addColor").onclick=()=>{if(colors.length>=10)return alert("色は10色までです。");snapshot();colors.push({name:`色${colors.length+1}`,value:"#C9A6A6"});activeColor=colors.length-1;renderColors()}
function getSelRect(){if(!selStart||!selEnd)return null;return{r1:Math.min(selStart.r,selEnd.r),r2:Math.max(selStart.r,selEnd.r),c1:Math.min(selStart.c,selEnd.c),c2:Math.max(selStart.c,selEnd.c)}}
function inSelection(r,c){const s=getSelRect();return s&&r>=s.r1&&r<=s.r2&&c>=s.c1&&c<=s.c2}
function renderChart(){const ch=$("chart");ch.innerHTML="";ch.style.gridTemplateColumns=`repeat(${cols},27px)`;const inert=mode==="move";for(let vr=rows-1;vr>=0;vr--){for(let c=0;c<cols;c++){const cell=document.createElement("button");cell.className="cell"+(inSelection(vr,c)?" selected":"");cell.style.background=colors[grid[vr][c]]?.value||"#fff";cell.textContent=grid[vr][c]+1;if(inert)cell.style.pointerEvents="none";cell.onpointerdown=e=>{e.preventDefault();isDown=true;if(mode==="paint"){snapshot();paintValue=activeColor;setCell(vr,c,paintValue)}else if(mode==="select"){selStart={r:vr,c};selEnd={r:vr,c};renderChart();updateSelectionButtons()}};cell.onpointerenter=()=>{if(!isDown)return;if(mode==="paint")setCell(vr,c,paintValue);else if(mode==="select"){selEnd={r:vr,c};renderChart();updateSelectionButtons()}};cell.onpointerup=()=>{isDown=false;paintValue=null};ch.appendChild(cell)}}$("chartInfo").textContent=`${cols}目 × ${rows}段`; $("modeInfo").textContent=mode==="paint"?"塗るモード":mode==="select"?"選択モード":"移動モード"}
window.addEventListener("pointerup",()=>{isDown=false;paintValue=null})
function setCell(r,c,v){if(grid[r][c]===v)return;grid[r][c]=v;renderChart();renderPreview()}
function hexRgb(hex){hex=hex.replace("#","");return{r:parseInt(hex.slice(0,2),16),g:parseInt(hex.slice(2,4),16),b:parseInt(hex.slice(4,6),16)}}
function mix(hex,delta){const o=hexRgb(hex),cl=x=>Math.max(0,Math.min(255,x));return `rgb(${cl(o.r+delta)},${cl(o.g+delta)},${cl(o.b+delta)})`}
function drawStitch(ctx,x,y,w,h,color,row,col){
  const variation=((row*17+col*11)%11)-5;
  const dark=mix(color,-42+variation), mid=mix(color,-10+variation), light=mix(color,28+variation), shine=mix(color,50);
  ctx.lineCap="round";ctx.lineJoin="round";
  ctx.globalAlpha=.22; ctx.lineWidth=Math.max(2,w*.38);
  ctx.strokeStyle="rgba(0,0,0,.18)";
  ctx.beginPath();ctx.moveTo(x+w*.22,y+h*.16);ctx.bezierCurveTo(x+w*.24,y+h*.30,x+w*.40,y+h*.62,x+w*.50,y+h*.93);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w*.78,y+h*.16);ctx.bezierCurveTo(x+w*.76,y+h*.30,x+w*.60,y+h*.62,x+w*.50,y+h*.93);ctx.stroke();
  ctx.globalAlpha=1;
  ctx.lineWidth=Math.max(2,w*.30);
  ctx.strokeStyle=dark;
  ctx.beginPath();ctx.moveTo(x+w*.23,y+h*.08);ctx.bezierCurveTo(x+w*.24,y+h*.28,x+w*.39,y+h*.57,x+w*.50,y+h*.92);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w*.77,y+h*.08);ctx.bezierCurveTo(x+w*.76,y+h*.28,x+w*.61,y+h*.57,x+w*.50,y+h*.92);ctx.stroke();
  ctx.lineWidth=Math.max(2,w*.22);
  ctx.strokeStyle=mid;
  ctx.beginPath();ctx.moveTo(x+w*.23,y+h*.08);ctx.bezierCurveTo(x+w*.29,y+h*.28,x+w*.42,y+h*.56,x+w*.50,y+h*.88);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w*.77,y+h*.08);ctx.bezierCurveTo(x+w*.71,y+h*.28,x+w*.58,y+h*.56,x+w*.50,y+h*.88);ctx.stroke();
  ctx.lineWidth=Math.max(1,w*.11);
  ctx.strokeStyle=light;
  ctx.beginPath();ctx.moveTo(x+w*.30,y+h*.14);ctx.quadraticCurveTo(x+w*.39,y+h*.42,x+w*.48,y+h*.77);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w*.70,y+h*.14);ctx.quadraticCurveTo(x+w*.61,y+h*.42,x+w*.52,y+h*.77);ctx.stroke();
  ctx.globalAlpha=.45; ctx.strokeStyle=shine; ctx.lineWidth=Math.max(1,w*.05);
  ctx.beginPath();ctx.moveTo(x+w*.34,y+h*.22);ctx.quadraticCurveTo(x+w*.40,y+h*.42,x+w*.46,y+h*.66);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w*.66,y+h*.22);ctx.quadraticCurveTo(x+w*.60,y+h*.42,x+w*.54,y+h*.66);ctx.stroke();
  ctx.globalAlpha=.18; ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=Math.max(1,w*.04);
  ctx.beginPath();ctx.moveTo(x+w*.26,y+h*.08);ctx.lineTo(x+w*.36,y+h*.16);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+w*.74,y+h*.08);ctx.lineTo(x+w*.64,y+h*.16);ctx.stroke();
  ctx.globalAlpha=1;
}
function renderPreview(){
  const repX=Math.max(1,+$("repX").value||1), repY=Math.max(1,+$("repY").value||1);
  const totalC=cols*repX, totalR=rows*repY;
  let sw=21, sh=15;
  const maxPix=2300;
  if(totalC*sw>maxPix){sw=maxPix/totalC; sh=sw*.72}
  const pad=18;
  const cv=$("preview"), ctx=cv.getContext("2d");
  cv.width=Math.ceil(totalC*sw+pad*2); cv.height=Math.ceil(totalR*sh+pad*2);
  const bg=ctx.createLinearGradient(0,0,0,cv.height); bg.addColorStop(0,"#e9e3dd"); bg.addColorStop(1,"#ddd5cc");
  ctx.fillStyle=bg; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.fillStyle="rgba(0,0,0,.06)"; ctx.fillRect(pad+4,pad+6,totalC*sw,totalR*sh);
  ctx.fillStyle="#f1ece6"; ctx.fillRect(pad,pad,totalC*sw,totalR*sh);
  for(let rr=0; rr<totalR; rr++){
    for(let cc=0; cc<totalC; cc++){
      const pr=rr%rows, pc=cc%cols;
      const color=colors[grid[pr][pc]]?.value||"#ebe5de";
      const x=pad+cc*sw, y=pad+(totalR-1-rr)*sh;
      drawStitch(ctx,x,y,sw,sh,color,rr,cc);
    }
  }
  const gs=Math.max(1,+$("gaugeSt").value||22), gr=Math.max(1,+$("gaugeRow").value||30);
  const w=(totalC/gs)*10, h=(totalR/gr)*10;
  $("sizeInfo").textContent=`約 ${w.toFixed(1)} × ${h.toFixed(1)} cm`;
  $("repeatInfo").textContent=`${repX} × ${repY} リピート`;
}
["repX","repY","gaugeSt","gaugeRow"].forEach(id=>$(id).addEventListener("input",renderPreview))
$("resize").onclick=()=>{const nr=Math.max(1,Math.min(100,+$("rows").value||1)), nc=Math.max(1,Math.min(100,+$("cols").value||1));snapshot();const ng=Array.from({length:nr},()=>Array(nc).fill(0));for(let r=0;r<Math.min(rows,nr);r++)for(let c=0;c<Math.min(cols,nc);c++)ng[r][c]=grid[r][c];rows=nr;cols=nc;grid=ng;selStart=selEnd=null;renderChart();renderPreview()}
$("clear").onclick=()=>{if(!confirm("編み図を全部クリアしますか？"))return;snapshot();grid=Array.from({length:rows},()=>Array(cols).fill(0));selStart=selEnd=null;renderChart();renderPreview()}
function setMode(m){mode=m;["paintMode","selectMode","moveMode"].forEach(id=>$(id).classList.remove("active"));$(m+"Mode").classList.add("active");renderChart()}
$("paintMode").onclick=()=>setMode("paint"); $("selectMode").onclick=()=>setMode("select"); $("moveMode").onclick=()=>setMode("move");
function updateSelectionButtons(){const has=!!getSelRect();$("copySel").disabled=!has;$("clearSel").disabled=!has;$("pasteSel").disabled=!clipboard}
$("clearSel").onclick=()=>{selStart=selEnd=null;renderChart();updateSelectionButtons()}
$("copySel").onclick=()=>{const s=getSelRect();if(!s)return;clipboard=[];for(let r=s.r1;r<=s.r2;r++)clipboard.push(grid[r].slice(s.c1,s.c2+1));$("pasteSel").disabled=false;toast("選択範囲をコピーしました")}
$("pasteSel").onclick=()=>{if(!clipboard)return;const base=selStart||{r:0,c:0};snapshot();for(let r=0;r<clipboard.length;r++)for(let c=0;c<clipboard[r].length;c++){const rr=base.r+r,cc=base.c+c;if(rr<rows&&cc<cols)grid[rr][cc]=clipboard[r][c]}renderChart();renderPreview();toast("貼り付けました")}
$("mirrorH").onclick=()=>{snapshot();grid=grid.map(r=>r.slice().reverse());renderChart();renderPreview()}
$("mirrorV").onclick=()=>{snapshot();grid=grid.slice().reverse();renderChart();renderPreview()}
$("shiftL").onclick=()=>{snapshot();grid=grid.map(r=>r.slice(1).concat(r[0]));renderChart();renderPreview()}
$("shiftR").onclick=()=>{snapshot();grid=grid.map(r=>[r[r.length-1]].concat(r.slice(0,-1)));renderChart();renderPreview()}
function getData(){return{version:4,rows,cols,grid,colors,repX:+$("repX").value||1,repY:+$("repY").value||1,gaugeSt:+$("gaugeSt").value||22,gaugeRow:+$("gaugeRow").value||30}}
function applyData(d){rows=d.rows;cols=d.cols;grid=d.grid;colors=d.colors;$("rows").value=rows;$("cols").value=cols;$("repX").value=d.repX||1;$("repY").value=d.repY||1;$("gaugeSt").value=d.gaugeSt||22;$("gaugeRow").value=d.gaugeRow||30;activeColor=0;selStart=selEnd=null;renderColors();renderChart();renderPreview()}
$("save").onclick=()=>{localStorage.setItem("knitPreviewStudioV4",JSON.stringify(getData()));toast("この端末に保存しました")}
$("load").onclick=()=>{const raw=localStorage.getItem("knitPreviewStudioV4");if(!raw)return alert("保存データがありません");snapshot();applyData(JSON.parse(raw));toast("保存データを開きました")}
$("exportPng").onclick=()=>{const a=document.createElement("a");a.download="knit-preview.png";a.href=$("preview").toDataURL("image/png");a.click()}
$("exportJson").onclick=()=>{const blob=new Blob([JSON.stringify(getData(),null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="knit-pattern.json";a.click();URL.revokeObjectURL(a.href)}
$("importBtn").onclick=()=>$("importJson").click()
$("importJson").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());snapshot();applyData(d);toast("JSONを読み込みました")}catch(err){alert("JSONを読み込めませんでした")}e.target.value=""}
// drag scroll in move mode
let drag=null;
chartWrap.addEventListener("pointerdown",e=>{
  if(mode!=="move") return;
  drag={x:e.clientX,y:e.clientY,left:chartWrap.scrollLeft,top:chartWrap.scrollTop};
  chartWrap.classList.add("grabbing");
});
window.addEventListener("pointermove",e=>{
  if(!drag || mode!=="move") return;
  chartWrap.scrollLeft = drag.left - (e.clientX-drag.x);
  chartWrap.scrollTop = drag.top - (e.clientY-drag.y);
});
window.addEventListener("pointerup",()=>{drag=null; chartWrap.classList.remove("grabbing")});
init();
</script>
</body>
</html>
